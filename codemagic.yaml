workflows:
  ios-build:
    name: iOS build unsigned ipa
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - flutter clean
      - flutter pub get
      - cd ios && pod install && cd ..
      # 在CI里直接修改pbxproj，注入占位Team ID（A9B8C7D6E5，随便一串10字符）
      - sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = A9B8C7D6E5;/g' ios/Runner.xcodeproj/project.pbxproj
      # 现在Flutter不再拦截，继续编译，不签名
      - flutter build ios --debug --no-codesign
      # Mac CI上直接打包Payload生成标准ipa，下载后丢Sideloadly
      - mkdir -p build/ios/Payload
      - cp -r build/ios/iphoneos/Runner.app build/ios/Payload/Runner.app
      - cd build/ios && zip -q -r app.ipa Payload
    artifacts:
      - build/ios/app.ipa
