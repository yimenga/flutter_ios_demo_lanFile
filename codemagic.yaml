workflows:
  ios-build:
    name: iOS build unsigned app
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - flutter clean
      - flutter pub get
      - cd ios && pod install && cd ..
      # 编译，输出 build/ios/iphoneos/Runner.app
      - flutter build ios --debug --no-codesign
    artifacts:
      - build/ios/iphoneos/**/*.app
