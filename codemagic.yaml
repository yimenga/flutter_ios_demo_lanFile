workflows:
  ios-build:
    name: iOS Debug build
    instance_type: mac_mini_m2
    environment:
      flutter: 3.22.0
    scripts:
      - flutter pub get
      - cd ios && pod install && cd ..
      # 重点：加上export，直接导出ipa
      - flutter build ipa --debug --build-name=1.0.0 --build-number=1 --no-codesign --export-options-plist=ios/ExportOptions.plist
    artifacts:
      - build/ios/ipa/*.ipa
